openapi: 3.0.3
info:
  title: LeadGen Bot AI Configuration API
  description: Shared API contract for configuring the AI Dialogue Engine (prompt templates, persona, tone of voice) and automated stop-rules/triggers.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Base URL for AI Configuration API
paths:
  /ai-config:
    get:
      summary: Retrieve the current global AI Configuration
      description: Returns the active prompt templates, persona settings, tone of voice, and automated stop-rules.
      operationId: getAiConfig
      responses:
        '200':
          description: AI Configuration retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiConfigDTO'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
    put:
      summary: Update the global AI Configuration
      description: Replaces the active prompt templates, persona, tone of voice, and automated stop-rule triggers.
      operationId: updateAiConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiConfigDTO'
      responses:
        '200':
          description: AI Configuration updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiConfigDTO'
        '400':
          description: Invalid request body or validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  /dialogs/{telegramChatId}/ai-state:
    get:
      summary: Retrieve the AI State for a specific dialog
      description: Returns whether the AI is currently ACTIVE, PAUSED, or STOPPED for a specific Telegram chat, along with the trigger or reason if stopped.
      operationId: getDialogAiState
      parameters:
        - name: telegramChatId
          in: path
          required: true
          description: Unique Telegram Chat Identifier associated with the dialog.
          schema:
            type: string
      responses:
        '200':
          description: Dialog AI state retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogAiStateDTO'
        '404':
          description: Dialog with the specified telegramChatId was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
    put:
      summary: Update the AI State for a specific dialog (e.g., manual override or stop trigger)
      description: Sets the AI state (ACTIVE, STOPPED, PAUSED) and logs the reason or trigger if the state is being changed.
      operationId: updateDialogAiState
      parameters:
        - name: telegramChatId
          in: path
          required: true
          description: Unique Telegram Chat Identifier associated with the dialog.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDialogAiStateDTO'
      responses:
        '200':
          description: Dialog AI state updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogAiStateDTO'
        '400':
          description: Invalid state transition or input value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Dialog with the specified telegramChatId was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

components:
  schemas:
    AiConfigDTO:
      type: object
      required:
        - agentPersona
        - toneOfVoice
        - stopRules
      properties:
        agentPersona:
          $ref: '#/components/schemas/AgentPersonaDTO'
        toneOfVoice:
          $ref: '#/components/schemas/ToneOfVoiceDTO'
        stopRules:
          $ref: '#/components/schemas/StopRulesDTO'

    AgentPersonaDTO:
      type: object
      required:
        - agentName
        - description
        - systemPromptTemplate
      properties:
        agentName:
          type: string
          example: "Travel Concierge"
          description: The name representing the AI Agent.
        description:
          type: string
          example: "A helpful, empathetic concierge that guides clients in finding relevant travel packages."
          description: Overview of the agent's background, boundaries, and primary objective.
        systemPromptTemplate:
          type: string
          example: "You are {agentName}, a virtual assistant. Your objective is {description}. Always answer concisely."
          description: Full prompt template used by the LLM containing instructions and placeholders.

    ToneOfVoiceDTO:
      type: object
      required:
        - voiceSpectrum
        - traits
      properties:
        voiceSpectrum:
          type: string
          enum: [FORMAL, CASUAL]
          example: FORMAL
          description: The overarching communication style on the Formal-Casual scale.
        traits:
          type: array
          items:
            type: string
          example: ["Enthusiastic", "Concise", "Empathetic"]
          description: List of specific behavioral / tone traits to enforce in interactions.

    StopRulesDTO:
      type: object
      required:
        - complexInquiry
        - negativeSentiment
        - humanRequest
        - customRules
      properties:
        complexInquiry:
          $ref: '#/components/schemas/ComplexInquiryRuleDTO'
        negativeSentiment:
          $ref: '#/components/schemas/NegativeSentimentRuleDTO'
        humanRequest:
          $ref: '#/components/schemas/HumanRequestRuleDTO'
        customRules:
          type: array
          items:
            $ref: '#/components/schemas/CustomStopRuleDTO'
          description: A list of any user-defined or custom stop-triggers.

    ComplexInquiryRuleDTO:
      type: object
      required:
        - enabled
        - maxSteps
      properties:
        enabled:
          type: boolean
          example: true
          description: Whether the AI should hand over to a human if the dialog complexity exceeds limits.
        maxSteps:
          type: integer
          example: 5
          description: The maximum number of dialog steps / reasoning turns permitted before automatic escalation.

    NegativeSentimentRuleDTO:
      type: object
      required:
        - enabled
        - sensitivityThreshold
      properties:
        enabled:
          type: boolean
          example: true
          description: Whether the AI should pause/stop when persistent user frustration or negative sentiment is detected.
        sensitivityThreshold:
          type: string
          enum: [HIGH, MEDIUM, LOW]
          example: MEDIUM
          description: The threshold level of sentiment validation. Higher sensitivity triggers escalation with milder frustration.

    HumanRequestRuleDTO:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          example: true
          description: Mandatory rule that halts AI dialogue immediately if the user requests human assistance (e.g., "speak to a human", "representative").

    CustomStopRuleDTO:
      type: object
      required:
        - id
        - name
        - description
        - enabled
      properties:
        id:
          type: string
          example: "competitor-mention"
          description: Unique string identifier for the custom stop rule.
        name:
          type: string
          example: "Competitor Mention Rule"
          description: The human-readable name of the rule.
        description:
          type: string
          example: "Stop dialogue and notify sales rep if any direct competitor is mentioned by name."
          description: Description of the trigger condition.
        enabled:
          type: boolean
          example: false
          description: Current operational status of the custom rule.

    DialogAiStateDTO:
      type: object
      required:
        - telegramChatId
        - aiState
        - updatedAt
      properties:
        telegramChatId:
          type: string
          example: "test_chat_123"
        aiState:
          type: string
          enum: [ACTIVE, STOPPED, PAUSED]
          example: STOPPED
          description: Grounded in the current backend domain model (AiState enum).
        stopReason:
          type: string
          example: "NegativeSentimentRule triggered - customer frustration detected."
          description: Detailed explanation of why the state is STOPPED or PAUSED (e.g., which rule fired).
        updatedAt:
          type: string
          format: date-time
          example: "2026-07-24T01:13:58Z"

    UpdateDialogAiStateDTO:
      type: object
      required:
        - aiState
      properties:
        aiState:
          type: string
          enum: [ACTIVE, STOPPED, PAUSED]
          example: STOPPED
        stopReason:
          type: string
          example: "Manual human operator takeover."
          description: Optional message explaining the reason for changing the AI State.

    ErrorResponseDTO:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-07-24T01:13:58.123Z"
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Validation failed: agentPersona.agentName is required."
        path:
          type: string
          example: "/api/v1/ai-config"
