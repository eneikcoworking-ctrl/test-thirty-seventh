openapi: 3.0.3
info:
  title: Account Management API
  description: Shared API contract for Telegram Account & Session Management (FEAT-ACC)
  version: 1.0.0
servers:
  - url: /
    description: Default Server

paths:
  /api/accounts:
    get:
      summary: List all Telegram accounts
      description: Returns a list of all connected Telegram accounts and their configurations.
      responses:
        '200':
          description: Successfully retrieved accounts list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TgAccountList'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/accounts/{id}:
    get:
      summary: Get Telegram account details
      description: Returns detailed information for a single Telegram account by its ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique ID of the Telegram account
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successfully retrieved account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TgAccount'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      summary: Delete a Telegram account
      description: Removes a Telegram account and terminates its session.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique ID of the Telegram account to delete
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Account successfully deleted. No content.
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/accounts/onboard/request-otp:
    post:
      summary: Initiate account onboarding via OTP
      description: Requests a Telegram verification OTP code to be sent to the specified phone number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardRequestOtpRequest'
      responses:
        '200':
          description: OTP successfully requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardRequestOtpResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/accounts/onboard/verify-otp:
    post:
      summary: Complete onboarding with OTP code
      description: Verifies the received OTP code and finishes adding the Telegram account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardVerifyOtpRequest'
      responses:
        '200':
          description: OTP verified and account successfully onboarded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TgAccount'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/accounts/onboard/upload-session:
    post:
      summary: Onboard account using pre-authenticated session
      description: Allows onboarding by uploading pre-authenticated session details (e.g., converted .session data).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardUploadSessionRequest'
      responses:
        '200':
          description: Session uploaded and account successfully onboarded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TgAccount'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/accounts/{id}/proxy:
    put:
      summary: Bind a proxy to an account
      description: Mandatorily binds a specific IPv4/IPv6 SOCKS5/HTTP proxy to prevent multi-account ip-ban chaining.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique ID of the Telegram account
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindProxyRequest'
      responses:
        '200':
          description: Proxy successfully bound to the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TgAccount'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/accounts/{id}/settings:
    put:
      summary: Update account settings (rate limits & human emulation)
      description: Configures outbound messaging limits and pauses between actions for human-behavior emulation.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique ID of the Telegram account
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountSettings'
      responses:
        '200':
          description: Account settings successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSettings'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/accounts/{id}/check-health:
    post:
      summary: Trigger session health monitoring check
      description: Performs a real-time status check on the Telegram session and updates the health status.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique ID of the Telegram account to check
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Health check completed. Returns the updated status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  status:
                    $ref: '#/components/schemas/SessionStatus'
                  lastCheckedAt:
                    type: string
                    format: date-time
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/proxies:
    get:
      summary: List all proxies
      description: Retrieves a list of all configured proxies.
      responses:
        '200':
          description: Successfully retrieved list of proxies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyList'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      summary: Add a new proxy
      description: Adds/Registers a new SOCKS5/HTTP proxy in the system pool.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyCreateRequest'
      responses:
        '201':
          description: Proxy successfully registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proxy'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/proxies/{id}:
    get:
      summary: Get proxy details
      description: Returns details of a specific proxy.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique ID of the proxy
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successfully retrieved proxy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proxy'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      summary: Delete a proxy
      description: Removes a proxy from the system pool.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique ID of the proxy to delete
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Proxy successfully deleted. No content.
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  responses:
    BadRequestError:
      description: Invalid request parameters or body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: An unexpected internal server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    SessionStatus:
      type: string
      enum:
        - Active
        - Temporary Spam-Block
        - Permanent Ban
        - Re-authorization Required
      description: Real-time track of session status.

    Proxy:
      type: object
      required:
        - id
        - ipAddress
        - port
        - protocol
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the proxy
        ipAddress:
          type: string
          description: IPv4 or IPv6 address of the proxy
        port:
          type: integer
          description: Connection port
        protocol:
          type: string
          enum: [HTTP, SOCKS5]
          description: Connection protocol
        username:
          type: string
          description: Optional authentication username
        password:
          type: string
          description: Optional authentication password

    ProxyList:
      type: array
      items:
        $ref: '#/components/schemas/Proxy'

    ProxyCreateRequest:
      type: object
      required:
        - ipAddress
        - port
        - protocol
      properties:
        ipAddress:
          type: string
        port:
          type: integer
        protocol:
          type: string
          enum: [HTTP, SOCKS5]
        username:
          type: string
        password:
          type: string

    TgAccount:
      type: object
      required:
        - id
        - phoneNumber
        - status
      properties:
        id:
          type: integer
          format: int64
        phoneNumber:
          type: string
          description: Phone number in international format
        sessionData:
          type: string
          description: Serialized session or path token
        status:
          $ref: '#/components/schemas/SessionStatus'
        proxy:
          $ref: '#/components/schemas/Proxy'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TgAccountList:
      type: array
      items:
        $ref: '#/components/schemas/TgAccount'

    OnboardRequestOtpRequest:
      type: object
      required:
        - phoneNumber
      properties:
        phoneNumber:
          type: string
          description: Phone number of the account to be onboarded in international format

    OnboardRequestOtpResponse:
      type: object
      required:
        - onboardId
        - status
      properties:
        onboardId:
          type: string
          description: Session code to map subsequent OTP verification
        status:
          type: string
          enum: [PENDING_OTP, FAILED]

    OnboardVerifyOtpRequest:
      type: object
      required:
        - onboardId
        - code
      properties:
        onboardId:
          type: string
        code:
          type: string
          description: OTP verification code received via Telegram

    OnboardUploadSessionRequest:
      type: object
      required:
        - phoneNumber
        - sessionData
      properties:
        phoneNumber:
          type: string
        sessionData:
          type: string
          description: Converted JSON/Session pre-authenticated string data
        proxyId:
          type: integer
          format: int64
          description: Optional ID of the isolated proxy to bind immediately

    BindProxyRequest:
      type: object
      required:
        - proxyId
      properties:
        proxyId:
          type: integer
          format: int64

    AccountSettings:
      type: object
      required:
        - dailyMessagingLimit
        - minPauseSeconds
        - maxPauseSeconds
        - emulateTyping
      properties:
        dailyMessagingLimit:
          type: integer
          description: Hard-coded messaging rate limit per 24h
          default: 15
        minPauseSeconds:
          type: integer
          description: Minimum random delay between actions
          default: 120
        maxPauseSeconds:
          type: integer
          description: Maximum random delay between actions
          default: 300
        emulateTyping:
          type: boolean
          description: Whether to emulate typing chat state before sending messages
          default: true

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
