openapi: 3.0.3
info:
  title: LeadGen Bot Live Chat CRM API Contract
  description: |
    Shared API contract for Live Chat CRM (LeadGen Bot).
    Defines the endpoints, request/response shapes, and WebSocket real-time payloads
    required for managing real-time conversations, manual messages, and escalations.
  version: 1.0.0
servers:
  - url: /
    description: Local development / relative path server
paths:
  /api/v1/conversations:
    get:
      summary: Fetch conversations
      description: |
        Returns a list of active or escalated conversations for CRM agents.
        Supports filtering by escalation status, assigned agent, and pagination.
      parameters:
        - name: escalationStatus
          in: query
          required: false
          description: Filter by escalation status (e.g., ALL, ESCALATED, PENDING, RESOLVED)
          schema:
            type: string
            enum: [ALL, ESCALATED, PENDING, RESOLVED]
            default: ALL
        - name: assignedAgentId
          in: query
          required: false
          description: Filter conversations assigned to a specific human representative
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Maximum number of conversations to retrieve
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          required: false
          description: Page index (0-based) for pagination
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: A paginated list of conversations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/conversations/{conversationId}/messages:
    get:
      summary: Retrieve messages for a conversation
      description: Returns conversation history with full context of dialogue turns.
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Unique identifier of the conversation
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Maximum number of messages to retrieve
          schema:
            type: integer
            default: 50
        - name: beforeMessageId
          in: query
          required: false
          description: Retrieve messages prior to this message ID for lazy loading
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of messages inside the specified conversation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '401':
          description: Unauthorized
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error

    post:
      summary: Send a manual message
      description: |
        Allows a human representative to send a manual message to the prospect.
        This action automatically marks the conversation as actively being handled by a human
        and suspends automated AI responses until resolved.
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Unique identifier of the conversation
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid payload content or bad formatting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error

  /api/v1/scheduler/delay:
    post:
      summary: Compute action delay
      description: Computes action delay using an exponential distribution based on the provided mean delay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Delay computed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionDelayResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/campaigns/assignments:
    post:
      summary: Assign campaign to account
      description: Validates and assigns a campaign to a specific Telegram account, rejecting accounts under 1 month old.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignAssignmentRequest'
      responses:
        '201':
          description: Campaign successfully assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignAssignmentResponse'
        '400':
          description: Account is too young or invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Conversation:
      type: object
      required:
        - id
        - telegramChatId
        - leadName
        - leadUsername
        - status
        - lastMessageAt
      properties:
        id:
          type: string
          format: uuid
          description: Internal database ID of the conversation
        telegramChatId:
          type: integer
          format: int64
          description: Unique ID of the chat in Telegram
        leadName:
          type: string
          description: First and last name of the lead
        leadUsername:
          type: string
          nullable: true
          description: Telegram @username if available
        leadPhone:
          type: string
          nullable: true
          description: Contact phone number of the lead if available
        status:
          type: string
          enum: [ACTIVE, ESCALATED, RESOLVED, PAUSED]
          description: Status of the conversation inside CRM
        assignedAgentId:
          type: string
          format: uuid
          nullable: true
          description: ID of the human representative currently handling the lead
        lastMessageAt:
          type: string
          format: date-time
          description: Timestamp of the most recent message
        createdAt:
          type: string
          format: date-time

    ConversationPage:
      type: object
      required:
        - content
        - totalElements
        - totalPages
        - page
        - size
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        totalElements:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
        size:
          type: integer

    Message:
      type: object
      required:
        - id
        - conversationId
        - text
        - senderType
        - sentAt
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        text:
          type: string
          description: Content of the message
        senderType:
          type: string
          enum: [LEAD, AI_AGENT, HUMAN_REPRESENTATIVE]
          description: Identifies who sent the message
        sentAt:
          type: string
          format: date-time
        senderName:
          type: string
          description: Display name of the sender

    SendMessageRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          description: Content of the message to be sent to the lead via Telegram.

    ErrorResponse:
      type: object
      required:
        - errorCode
        - message
        - timestamp
      properties:
        errorCode:
          type: string
          description: Machine-readable specific error classification code
        message:
          type: string
          description: Human-readable detail message
        timestamp:
          type: string
          format: date-time
        details:
          type: array
          items:
            type: string
          description: Detailed validation/context errors

    # =========================================================================
    # WebSocket typed event payload specifications (Real-time Requirements)
    # =========================================================================

    WebSocketEvent:
      type: object
      required:
        - eventType
        - timestamp
        - payload
      properties:
        eventType:
          type: string
          enum: [CHAT_MESSAGE, CONVERSATION_ESCALATED, AGENT_STATUS]
          description: Identifies the specific real-time event type
        timestamp:
          type: string
          format: date-time
        payload:
          type: object
          description: The typed payload corresponding to the eventType.
          oneOf:
            - $ref: '#/components/schemas/ChatMessageEvent'
            - $ref: '#/components/schemas/ConversationEscalatedEvent'
            - $ref: '#/components/schemas/AgentStatusEvent'

    ChatMessageEvent:
      type: object
      required:
        - conversationId
        - message
      properties:
        conversationId:
          type: string
          format: uuid
        message:
          $ref: '#/components/schemas/Message'
          description: The actual real-time chat message content.

    ConversationEscalatedEvent:
      type: object
      required:
        - conversationId
        - escalatedAt
        - reason
      properties:
        conversationId:
          type: string
          format: uuid
        escalatedAt:
          type: string
          format: date-time
        reason:
          type: string
          description: 'Reason for escalation (e.g. "Triggered by stop-rule: request for human agent")'
        lastMessageText:
          type: string
          description: Snippet of the message that triggered the escalation

    AgentStatusEvent:
      type: object
      required:
        - agentId
        - status
      properties:
        agentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ONLINE, OFFLINE, BUSY]

    ActionRequest:
      type: object
      required:
        - actionType
        - meanDelaySeconds
      properties:
        actionType:
          type: string
          description: The type of action being scheduled
        meanDelaySeconds:
          type: number
          format: double
          description: The expected mean (average) delay in seconds

    ActionDelayResponse:
      type: object
      required:
        - delaySeconds
      properties:
        delaySeconds:
          type: number
          format: double
          description: The computed randomized delay in seconds

    CampaignAssignmentRequest:
      type: object
      required:
        - campaignId
        - accountId
        - accountType
      properties:
        campaignId:
          type: string
          format: uuid
          description: Unique identifier of the campaign
        accountId:
          type: integer
          format: int64
          description: ID of the account to assign
        accountType:
          type: string
          enum: [TG_ACCOUNT, WARM_UP_ACCOUNT]
          description: Type of the account to be assigned

    CampaignAssignmentResponse:
      type: object
      required:
        - campaignId
        - accountId
        - accountType
        - status
      properties:
        campaignId:
          type: string
          format: uuid
        accountId:
          type: integer
          format: int64
        accountType:
          type: string
        status:
          type: string
          description: Status of the assignment (e.g. ASSIGNED)
