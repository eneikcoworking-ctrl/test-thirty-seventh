openapi: 3.0.3
info:
  title: LeadGen Bot Live Chat CRM API Contract
  description: |
    Shared API contract for Live Chat CRM and Campaigns (LeadGen Bot).
    Defines the endpoints, request/response shapes, and WebSocket real-time payloads
    required for managing real-time conversations, manual messages, escalations, campaigns, and lead imports.
  version: 1.0.0
servers:
  - url: /
    description: Local development / relative path server
paths:
  /api/v1/conversations:
    get:
      summary: Fetch conversations
      description: |
        Returns a list of active or escalated conversations for CRM agents.
        Supports filtering by escalation status, assigned agent, and pagination.
      parameters:
        - name: escalationStatus
          in: query
          required: false
          description: Filter by escalation status (e.g., ALL, ESCALATED, PENDING, RESOLVED)
          schema:
            type: string
            enum: [ALL, ESCALATED, PENDING, RESOLVED]
            default: ALL
        - name: assignedAgentId
          in: query
          required: false
          description: Filter conversations assigned to a specific human representative
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Maximum number of conversations to retrieve
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          required: false
          description: Page index (0-based) for pagination
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: A paginated list of conversations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/conversations/{conversationId}/messages:
    get:
      summary: Retrieve messages for a conversation
      description: Returns conversation history with full context of dialogue turns.
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Unique identifier of the conversation
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Maximum number of messages to retrieve
          schema:
            type: integer
            default: 50
        - name: beforeMessageId
          in: query
          required: false
          description: Retrieve messages prior to this message ID for lazy loading
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of messages inside the specified conversation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '401':
          description: Unauthorized
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error

    post:
      summary: Send a manual message
      description: |
        Allows a human representative to send a manual message to the prospect.
        This action automatically marks the conversation as actively being handled by a human
        and suspends automated AI responses until resolved.
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Unique identifier of the conversation
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid payload content or bad formatting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error

  /api/v1/campaigns:
    post:
      summary: Create a campaign
      description: Creates a new cold outreach campaign with associated spintax rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
      responses:
        '201':
          description: Campaign created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          description: Invalid input or validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/campaigns/{campaignId}/leads/import:
    post:
      summary: Import leads into a campaign
      description: |
        Imports lead target lists (@username or phone numbers) via CSV or plain text lines
        associated with a specific campaign.
      parameters:
        - name: campaignId
          in: path
          required: true
          description: Unique identifier of the campaign
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportLeadsRequest'
      responses:
        '201':
          description: Leads imported successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lead'
        '400':
          description: Invalid input or parsing failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Conversation:
      type: object
      required:
        - id
        - telegramChatId
        - leadName
        - leadUsername
        - status
        - lastMessageAt
      properties:
        id:
          type: string
          format: uuid
          description: Internal database ID of the conversation
        telegramChatId:
          type: integer
          format: int64
          description: Unique ID of the chat in Telegram
        leadName:
          type: string
          description: First and last name of the lead
        leadUsername:
          type: string
          nullable: true
          description: Telegram @username if available
        leadPhone:
          type: string
          nullable: true
          description: Contact phone number of the lead if available
        status:
          type: string
          enum: [ACTIVE, ESCALATED, RESOLVED, PAUSED]
          description: Status of the conversation inside CRM
        assignedAgentId:
          type: string
          format: uuid
          nullable: true
          description: ID of the human representative currently handling the lead
        lastMessageAt:
          type: string
          format: date-time
          description: Timestamp of the most recent message
        createdAt:
          type: string
          format: date-time

    ConversationPage:
      type: object
      required:
        - content
        - totalElements
        - totalPages
        - page
        - size
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        totalElements:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
        size:
          type: integer

    Message:
      type: object
      required:
        - id
        - conversationId
        - text
        - senderType
        - sentAt
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        text:
          type: string
          description: Content of the message
        senderType:
          type: string
          enum: [LEAD, AI_AGENT, HUMAN_REPRESENTATIVE]
          description: Identifies who sent the message
        sentAt:
          type: string
          format: date-time
        senderName:
          type: string
          description: Display name of the sender

    SendMessageRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          description: Content of the message to be sent to the lead via Telegram.

    ErrorResponse:
      type: object
      required:
        - errorCode
        - message
        - timestamp
      properties:
        errorCode:
          type: string
          description: Machine-readable specific error classification code
        message:
          type: string
          description: Human-readable detail message
        timestamp:
          type: string
          format: date-time
        details:
          type: array
          items:
            type: string
          description: Detailed validation/context errors

    Campaign:
      type: object
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the campaign
        name:
          type: string
          description: Name of the outreach campaign
        spintaxRules:
          type: string
          nullable: true
          description: Spintax syntax rule template (e.g. {Hi|Hello|Hey})
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the campaign was created

    CreateCampaignRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          description: Name of the outreach campaign
        spintaxRules:
          type: string
          description: Spintax syntax rules for message template engine

    Lead:
      type: object
      required:
        - id
        - campaignId
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the lead
        campaignId:
          type: string
          format: uuid
          description: Unique identifier of the associated campaign
        username:
          type: string
          nullable: true
          description: Telegram @username if available
        phoneNumber:
          type: string
          nullable: true
          description: Contact phone number if available
        status:
          type: string
          description: Outreach status of the lead (e.g. NEW)
        metadata:
          type: string
          nullable: true
          description: Extra contextual metadata for AI rephrasing or tracking
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the lead was imported

    ImportLeadsRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          description: |
            Raw CSV or plain text string representing the list of leads.
            Supports CSV with formatting: username,phoneNumber,metadata
            Or plain text lines of single entries (starting with @ for username, or digit-only for phoneNumber).

    # =========================================================================
    # WebSocket typed event payload specifications (Real-time Requirements)
    # =========================================================================

    WebSocketEvent:
      type: object
      required:
        - eventType
        - timestamp
        - payload
      properties:
        eventType:
          type: string
          enum: [CHAT_MESSAGE, CONVERSATION_ESCALATED, AGENT_STATUS]
          description: Identifies the specific real-time event type
        timestamp:
          type: string
          format: date-time
        payload:
          type: object
          description: The typed payload corresponding to the eventType.
          oneOf:
            - $ref: '#/components/schemas/ChatMessageEvent'
            - $ref: '#/components/schemas/ConversationEscalatedEvent'
            - $ref: '#/components/schemas/AgentStatusEvent'

    ChatMessageEvent:
      type: object
      required:
        - conversationId
        - message
      properties:
        conversationId:
          type: string
          format: uuid
        message:
          $ref: '#/components/schemas/Message'
          description: The actual real-time chat message content.

    ConversationEscalatedEvent:
      type: object
      required:
        - conversationId
        - escalatedAt
        - reason
      properties:
        conversationId:
          type: string
          format: uuid
        escalatedAt:
          type: string
          format: date-time
        reason:
          type: string
          description: 'Reason for escalation (e.g. "Triggered by stop-rule: request for human agent")'
        lastMessageText:
          type: string
          description: Snippet of the message that triggered the escalation

    AgentStatusEvent:
      type: object
      required:
        - agentId
        - status
      properties:
        agentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ONLINE, OFFLINE, BUSY]
